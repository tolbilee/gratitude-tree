<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e6">
<title>고마운 당신에게</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Pretendard,-apple-system,sans-serif;background:linear-gradient(160deg,#f7f3e8 0%,#e8f3e0 55%,#d6ecd9 100%);color:#2b3a2e}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;z-index:0;animation:float 9s ease-in-out infinite}
.b1{width:260px;height:260px;background:#ffd59e;top:-60px;right:-80px}
.b2{width:300px;height:300px;background:#b8e3b0;bottom:-90px;left:-100px;animation-delay:-4s}
@keyframes float{50%{transform:translate(20px,30px) scale(1.08)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.badge{align-self:flex-start;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:#4a8a3c;box-shadow:0 4px 14px rgba(60,100,50,.1);margin-bottom:14px}
h1{font-size:27px;line-height:1.3;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
h1 em{font-style:normal;color:#4a8a3c}
.sub{font-size:14.5px;color:#6b7a6c;margin-bottom:22px;line-height:1.5}
.card{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-radius:32px;padding:22px;box-shadow:0 18px 50px rgba(60,90,50,.14);transition:all .5s cubic-bezier(.6,-0.3,.4,1)}
.card.out{transform:scale(.85) translateY(30px);opacity:0;pointer-events:none}
label{display:block;font-size:13px;font-weight:700;color:#6b7a6c;margin:0 0 8px 6px}
.field{position:relative;margin-bottom:16px}
input,textarea{width:100%;border:2px solid transparent;background:#f3f5ef;border-radius:20px;padding:15px 18px;font:inherit;font-size:16px;color:#2b3a2e;outline:none;transition:.25s;resize:none}
input:focus,textarea:focus{border-color:#8cc97c;background:#fff;box-shadow:0 0 0 5px rgba(140,201,124,.18)}
textarea{height:130px;border-radius:24px;line-height:1.55}
.count{position:absolute;right:16px;bottom:10px;font-size:12px;color:#9aa69a}
button{width:100%;border:0;border-radius:999px;padding:18px;font:inherit;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#6dbb5a,#3f8f3a);box-shadow:0 10px 24px rgba(63,143,58,.35);transition:transform .15s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:scale(.96)}
button:disabled{opacity:.45}
.err{color:#d9534f;font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* ===== 편지 봉투 스테이지 ===== */
.stage{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;perspective:1000px;pointer-events:none;opacity:0;transition:opacity .3s}
.stage.on{opacity:1}
.env{position:relative;width:280px;height:180px;margin-top:120px;transform:translateY(120px);opacity:0;transition:transform .6s cubic-bezier(.2,1.3,.4,1),opacity .4s}
.stage.on .env{transform:none;opacity:1}
.env-back{position:absolute;inset:0;background:#e2c98f;border-radius:14px;z-index:1}
.letter-rig{position:absolute;left:14px;right:14px;bottom:9px;height:162px;z-index:2}
.letter{position:absolute;inset:0;background:#fffdf6;border-radius:12px;padding:14px 16px 34px;box-shadow:0 4px 18px rgba(0,0,0,.12);transform:translateY(-186px);
  transition:transform .7s cubic-bezier(.65,0,.3,1);overflow:hidden}
.letter .to{font-size:11px;color:#4a8a3c;font-weight:700;margin-bottom:6px}
.letter p{font-size:14px;line-height:1.4;color:#3a3a3a;word-break:keep-all}
.letter .from{position:absolute;right:16px;bottom:12px;font-size:12px;color:#888}
.letter.in{transform:translateY(0)}
.env-front{position:absolute;inset:0;background:linear-gradient(160deg,#f0d9a2,#e3c482);border-radius:14px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3}
.flap-rig{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;perspective:700px}
.env-flap{position:absolute;inset:0;background:linear-gradient(#d9bb78,#cfae68);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transform:rotateX(180deg);transition:transform .55s cubic-bezier(.5,0,.3,1.2);backface-visibility:hidden;border-radius:14px 14px 0 0}
.env.closed .env-flap{transform:rotateX(0)}
.seal{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-22px 0 0 -20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#d8432f);z-index:5;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.env.closed .seal{transform:scale(1);transition-delay:.55s}
.env.fly{animation:fly 1.5s cubic-bezier(.55,0,.4,1) forwards}
@keyframes fly{
  0%{transform:none}
  22%{transform:translate(-10px,40px) rotate(-8deg) scale(1.05)}
  100%{transform:translate(45vw,-120vh) rotate(28deg) scale(.15)}
}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none}

/* ===== 완료 화면 ===== */
.done{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;opacity:0;pointer-events:none;transition:opacity .6s}
.done.on{opacity:1;pointer-events:auto}
.done .icon{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(63,143,58,.25);margin-bottom:22px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.done h2{font-size:23px;font-weight:800;margin-bottom:10px;line-height:1.35}
.done p{color:#6b7a6c;font-size:15px;line-height:1.6;margin-bottom:30px}
.done button{max-width:260px;background:#fff;color:#3f8f3a;box-shadow:0 8px 20px rgba(60,90,50,.12)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<div class="wrap">
  <div class="badge">🌱 2026 감사 열매 나무</div>
  <h1>올 한 해, <em>고마웠던 사람</em>에게<br>마음을 전해보세요</h1>
  <p class="sub">보내주신 메시지는 대형 스크린 속 나무에<br>열매가 되어 열립니다.</p>
  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="name">보내는 사람</label>
      <input id="name" maxlength="20" placeholder="이름이나 별명 (예: 딸기농부)">
    </div>
    <div class="field">
      <label for="text">감사 메시지</label>
      <textarea id="text" maxlength="40" placeholder="엄마, 올해도 늘 곁에 있어줘서 고마워요"></textarea>
      <span class="count" id="count">0/40</span>
    </div>
    <button id="send" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      메시지 보내기
    </button>
    <div class="err" id="err"></div>
  </form>
</div>

<div class="stage" id="stage">
  <div class="env" id="env">
    <div class="env-back"></div>
    <div class="letter-rig">
      <div class="letter" id="letter">
        <div class="to">To. 고마운 당신에게</div>
        <p id="ltText"></p>
        <div class="from" id="ltFrom"></div>
      </div>
    </div>
    <div class="env-front"></div>
    <div class="flap-rig"><div class="env-flap"></div></div>
    <div class="seal">♥</div>
  </div>
</div>
<canvas id="fx"></canvas>

<div class="done" id="done">
  <div class="icon"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3f8f3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h2>편지가 대형 스크린으로<br>날아갔어요!</h2>
  <p>잠시 후 화면 속 나무에<br>당신의 감사 열매가 맺힙니다 🍎</p>
  <button id="again">한 통 더 쓰기</button>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const form=$('form'), nameI=$('name'), textI=$('text'), send=$('send'), err=$('err');
const sleep = ms => new Promise(r => setTimeout(r, ms));

textI.addEventListener('input', () => {
  $('count').textContent = `${textI.value.length}/40`;
  send.disabled = !textI.value.trim();
});

// ---- 반짝이 파티클 (봉투 궤적) ----
const fx=$('fx'), g=fx.getContext('2d'); let parts=[], tracking=false;
function fit(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
fit(); addEventListener('resize', fit);
const COLORS=['#ffd36b','#ff9c7a','#9be08a','#ffffff','#ffb3c7'];
function emit(x,y,n,spd=2){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*spd;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+.6,life:1,r:2+Math.random()*3.5,c:COLORS[i%COLORS.length],star:Math.random()<.35}); } }
function loop(){
  g.clearRect(0,0,innerWidth,innerHeight);
  if(tracking){ const b=$('env').getBoundingClientRect(); emit(b.left+b.width/2,b.top+b.height/2,4,1.5); }
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.03; p.life-=.016;
    g.globalAlpha=Math.max(p.life,0); g.fillStyle=p.c; g.beginPath();
    if(p.star){ const r=p.r*1.6; g.moveTo(p.x,p.y-r); g.quadraticCurveTo(p.x,p.y,p.x+r,p.y); g.quadraticCurveTo(p.x,p.y,p.x,p.y+r); g.quadraticCurveTo(p.x,p.y,p.x-r,p.y); g.quadraticCurveTo(p.x,p.y,p.x,p.y-r); }
    else g.arc(p.x,p.y,p.r*p.life,0,7);
    g.fill(); }
  g.globalAlpha=1; requestAnimationFrame(loop);
}
loop();

// ---- 전송 + 모션 ----
form.addEventListener('submit', async e => {
  e.preventDefault();
  const name=nameI.value.trim(), text=textI.value.trim();
  if(!text) return;
  send.disabled=true; err.textContent=''; document.activeElement.blur();

  const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const req = fetch(SB_URL+'/rest/v1/gratitude_messages',{
    method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({id,name:(name||'익명').slice(0,20),text:text.slice(0,40),t:Date.now()})
  }).then(r=>r.ok?{ok:true}:r.text().then(()=>({ok:false,error:'저장에 실패했어요'})))
    .catch(()=>({ok:false,error:'네트워크 연결을 확인해주세요'}));

  const env=$('env'), letter=$('letter'), stage=$('stage');
  $('ltText').textContent=text; $('ltFrom').textContent='From. '+(name||'익명');
  form.classList.add('out'); await sleep(350);
  stage.classList.add('on'); await sleep(700);
  letter.classList.add('in'); navigator.vibrate?.(15); await sleep(780);     // 카드를 봉투 안으로
  env.classList.add('closed'); navigator.vibrate?.(25); await sleep(1050);   // 3. 뚜껑 닫힌 뒤 씰

  const res = await req;
  if(!res.ok){ // 실패하면 원래 상태로
    stage.classList.remove('on'); env.className='env'; letter.className='letter';
    form.classList.remove('out'); send.disabled=false; err.textContent=res.error||'전송에 실패했어요'; return;
  }
  const b=env.getBoundingClientRect(); emit(b.left+b.width/2,b.top+b.height/2,40,5);
  tracking=true; env.classList.add('fly'); navigator.vibrate?.([20,40,20]);  // 4. 날아가기
  await sleep(1300); tracking=false;
  $('done').classList.add('on'); stage.classList.remove('on');
});

$('again').onclick = () => {
  $('done').classList.remove('on'); $('env').className='env'; $('letter').className='letter';
  textI.value=''; $('count').textContent='0/40'; send.disabled=true;
  form.classList.remove('out');
};
</script>
</body>
</html>
